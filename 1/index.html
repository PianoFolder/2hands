<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Für Elise — ปลดล็อกเปียโน 2 มือ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF8F1;--sage:#6F8F78;--deep:#3F5A48;--ink:#2B342D;--gold:#C2A15A;--line:#DFE4DA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-weight:300;line-height:1.7}
.wrap{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.lv{font-size:.9rem;color:var(--sage);font-weight:600}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:600;color:var(--deep);margin:.3rem 0 1.5rem}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:6px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.now{margin:.8rem 0 2rem;font-size:.95rem;color:#5B665D}
h2{font-size:1.1rem;font-weight:600;color:var(--deep);margin:2.2rem 0 .8rem}
.sheets{display:flex;flex-wrap:wrap;gap:.7rem}
.sheets a{flex:1 1 12rem;text-align:center;padding:.85rem 1rem;border:1px solid var(--sage);border-radius:5px;color:var(--deep);text-decoration:none;font-weight:600;font-size:.95rem}
.sheets a:hover{background:var(--sage);color:#fff}
ol{list-style:none}
ol li button{width:100%;display:flex;gap:.9rem;align-items:baseline;padding:.95rem .3rem;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
ol li:last-child button{border-bottom:1px solid var(--line)}
ol li button:hover{color:var(--sage)}
ol li button[aria-current="true"]{color:var(--sage);font-weight:600}
.num{color:var(--gold);font-weight:600;font-size:.85rem;min-width:4.2rem;flex-shrink:0}
.hw{display:block;margin-top:2.5rem;padding:1.2rem;background:var(--sage);color:#fff;text-align:center;text-decoration:none;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <p class="lv">เพลงที่ 1 · Lv. 1.5</p>
  <h1>Für Elise</h1>

  <div class="player"><iframe id="pl" src="" allow="fullscreen" allowfullscreen></iframe></div>
  <p class="now" id="now"></p>

  <h2>โน้ตเพลง</h2>
  <div class="sheets">
    <a href="1-letter.pdf">โน้ตแบบตัวอักษร</a>
    <a href="1-standard.pdf">โน้ตแบบสากล</a>
  </div>

  <h2>คลิปสอน</h2>
  <ol id="eps"></ol>

  <a class="hw" href="https://lin.ee/Nd6pxlW">ส่งการบ้านให้ครูตรวจทาง LINE</a>
</div>

<script>
// แก้ตรงนี้ที่เดียว  yt = YouTube ID , vm = Vimeo ID
const EPS = [
  {n:"ตัวอย่าง", t:"ฟังเพลงเต็ม Für Elise",  yt:"nYj2TTgut5U"},
  {n:"ที่มา",    t:"เรื่องเล่าเบื้องหลังเพลงนี้", yt:"j-5psQ9joFk"},
  {n:"EP1",     t:"ท่อน A มือขวา",          yt:"Nu2qa4xBWBU"},
  {n:"EP2",     t:"ท่อน A มือซ้าย",          yt:"WnjoXWaWJbI"},
  {n:"EP3",     t:"ท่อน A สองมือ",           yt:"MNxqU1KXL8k"},
  {n:"EP4",     t:"ท่อน B มือขวา",          yt:"Hj7y9lMOqu4"},
  {n:"EP5",     t:"ท่อน B มือซ้าย",          yt:"hW7ErONlgEA"},
  {n:"EP6",     t:"ท่อน B สองมือ",           yt:"1WJ9fSHdA5E"},
  {n:"EP7",     t:"ท่อน C และจบเพลง",        yt:"85abQIvgfKw"}
];
const pl=document.getElementById('pl'),now=document.getElementById('now'),eps=document.getElementById('eps');
EPS.forEach((e,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.innerHTML='<span class="num">'+e.n+'</span><span>'+e.t+'</span>';
  b.onclick=()=>play(i,true); li.appendChild(b); eps.appendChild(li);
});
function play(i,click){
  const e=EPS[i], ap = click ? '&autoplay=1' : '';
  pl.src = e.vm ? 'https://player.vimeo.com/video/'+e.vm+(click?'?autoplay=1':'')
                : 'https://www.youtube.com/embed/'+e.yt+'?rel=0&playsinline=1'+ap;
  now.textContent='กำลังเล่น: '+e.n+' — '+e.t;
  [...eps.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  if(click) document.querySelector('.player').scrollIntoView({behavior:'smooth',block:'start'});
}
play(0);
</script>
</body>
</html>
