<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Für Elise — ปลดล็อกเปียโน 2 มือ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF8F1;--sage:#6F8F78;--deep:#3F5A48;--ink:#2B342D;--gold:#C2A15A;--line:#DFE4DA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-weight:300;line-height:1.7}
.wrap{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.lv{font-size:.9rem;color:var(--sage);font-weight:600}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:600;color:var(--deep);margin:.3rem 0 1.5rem}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:6px;overflow:hidden;scroll-margin-top:1rem}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cue{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .25s ease}
.cue.gone{opacity:0}
.cue span{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 4px 20px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.cue span::after{content:"";margin-left:7px;border-left:28px solid var(--deep);border-top:18px solid transparent;border-bottom:18px solid transparent}
.now{margin:.8rem 0 .4rem;font-size:1rem;color:var(--deep);font-weight:600}
.hint{margin-bottom:2rem;font-size:.9rem;color:#7A857C}
h2{font-size:1.1rem;font-weight:600;color:var(--deep);margin:2.2rem 0 .8rem}
.sheets{display:flex;flex-wrap:wrap;gap:.7rem}
.sheets a{flex:1 1 12rem;text-align:center;padding:.85rem 1rem;border:1px solid var(--sage);border-radius:5px;color:var(--deep);text-decoration:none;font-weight:600;font-size:.95rem}
.sheets a:hover{background:var(--sage);color:#fff}
ol{list-style:none}
ol li button{width:100%;display:flex;gap:.9rem;align-items:baseline;padding:.95rem .3rem;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
ol li:last-child button{border-bottom:1px solid var(--line)}
ol li button:hover{color:var(--sage)}
ol li button[aria-current="true"]{color:var(--sage);font-weight:600}
.num{color:var(--gold);font-weight:600;font-size:.85rem;min-width:4.2rem;flex-shrink:0}
.hw{display:block;margin-top:2.5rem;padding:1.2rem;background:var(--sage);color:#fff;text-align:center;text-decoration:none;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <p class="lv">เพลงที่ 1 · Lv. 1.5</p>
  <h1>Für Elise</h1>

  <div class="player">
    <iframe id="pl" src="" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <div class="cue" id="cue"><span></span></div>
  </div>
  <p class="now" id="now"></p>
  <p class="hint">กดปุ่มเล่นตรงกลางจอเพื่อเริ่มเรียน</p>

  <h2>โน้ตเพลง</h2>
  <div class="sheets">
    <a href="1-letter.pdf">โน้ตแบบตัวอักษร</a>
    <a href="1-standard.pdf">โน้ตแบบสากล</a>
  </div>

  <h2>คลิปสอน</h2>
  <ol id="eps"></ol>

  <a class="hw" href="https://lin.ee/Nd6pxlW">ส่งการบ้านให้ครูตรวจทาง LINE</a>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
// แก้ตรงนี้ที่เดียว  vm = Vimeo ID
const EPS = [
  {n:"ตัวอย่าง", t:"ฟังเพลงเต็ม Für Elise",  vm:"1225332451"},
  {n:"ที่มา",    t:"เรื่องเล่าเบื้องหลังเพลงนี้", vm:"1225331447"},
  {n:"EP1",     t:"ท่อน A มือขวา",          vm:"1225331446"},
  {n:"EP2",     t:"ท่อน A มือซ้าย",          vm:"1225331448"},
  {n:"EP3",     t:"ท่อน A สองมือ",           vm:"1225331449"},
  {n:"EP4",     t:"ท่อน B มือขวา",          vm:"1225331581"},
  {n:"EP5",     t:"ท่อน B มือซ้าย",          vm:"1225331776"},
  {n:"EP6",     t:"ท่อน B สองมือ",           vm:"1225332086"},
  {n:"EP7",     t:"ท่อน C และจบเพลง",        vm:"1225332174"}
];
const VP='?badge=0&autopause=0&title=0&byline=0&portrait=0';
const pl=document.getElementById('pl'),now=document.getElementById('now'),
      eps=document.getElementById('eps'),cue=document.getElementById('cue');
EPS.forEach((e,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.innerHTML='<span class="num">'+e.n+'</span><span>'+e.t+'</span>';
  b.onclick=()=>pick(i,true); li.appendChild(b); eps.appendChild(li);
});
function watch(){
  try{
    const p=new Vimeo.Player(pl);
    p.on('play',()=>cue.classList.add('gone'));
    p.on('ended',()=>cue.classList.remove('gone'));
  }catch(err){}
}
function pick(i,click){
  pl.src='https://player.vimeo.com/video/'+EPS[i].vm+VP;
  cue.classList.remove('gone');
  now.textContent=EPS[i].n+' — '+EPS[i].t;
  [...eps.querySelectorAll('button')].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  if(click) document.querySelector('.player').scrollIntoView({behavior:'smooth',block:'start'});
  pl.onload=watch;
}
pick(0,false);
</script>
</body>
</html>
