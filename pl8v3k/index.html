<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>วิธีวางแผนการฝึก</title>
<link rel="stylesheet" href="/2hands/style.css">
<style>.solo{margin-top:1.5rem}
/* vertical (9:16) video for this page */
.player{max-width:22rem;margin-inline:auto;padding-top:0;aspect-ratio:9/16}</style>
</head>
<body>
<div class="wrap">
  <p class="lv">ปลดล็อกเปียโน 2 มือ</p>
  <h1>แผนการฝึก</h1>
  <div class="player" id="box">
    <iframe id="pl" src="" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <div class="cue" id="cue">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EFEBE2" fill-opacity=".9" fill-rule="evenodd"
          d="M50 0A50 50 0 1 0 50 100A50 50 0 1 0 50 0Z M39 29L73 50L39 71Z"/>
      </svg>
    </div>
  </div>
  <div class="expand"><button id="big">ขยายเต็มจอ</button></div>
  <p class="hint solo">กดปุ่มเล่นตรงกลางจอเพื่อดูคลิป</p>
  <a class="hw" href="https://lin.ee/Nd6pxlW">มีคำถาม ทักครูแฟ้มทาง LINE</a>
</div>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
var VM="1226174254";
var pl=document.getElementById('pl'),cue=document.getElementById('cue'),box=document.getElementById('box');
pl.src='https://player.vimeo.com/video/'+VM+'?badge=0&autopause=0&title=0&byline=0&portrait=0';
function hide(){cue.classList.add('gone');}
window.addEventListener('blur',hide);
box.addEventListener('pointerdown',hide);
var player;
try{player=new Vimeo.Player(pl);player.on('play',hide);}catch(e){}
document.getElementById('big').onclick=function(){
  if(player&&player.requestFullscreen){player.requestFullscreen().catch(function(){});}
};
</script>
</body>
</html>
